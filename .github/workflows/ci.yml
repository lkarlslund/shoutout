name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race ./...
      - run: go vet ./...
      - name: Linux binaries
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o build/shoutout-linux-amd64 ./cmd/shoutout
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o build/shoutout-linux-arm64 ./cmd/shoutout
      - uses: actions/upload-artifact@v4
        with:
          name: shoutout-linux
          path: |
            build/shoutout-linux-*
            licenses/

  native-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev ninja-build
      - run: cmake -S kde -B build/settings -G Ninja -DSHOUTOUT_KDE=OFF
      - run: cmake --build build/settings
      - run: ctest --test-dir build/settings --output-on-failure
